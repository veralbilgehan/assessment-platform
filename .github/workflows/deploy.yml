name: Deploy to Cloud Run

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Deploy secret kontrolü
        id: deploy_kontrol
        run: |
          if [ -n "${{ secrets.GCP_SA_KEY }}" ] && [ -n "${{ secrets.GCP_SERVICE_NAME }}" ]; then
            echo "hazir=true" >> "$GITHUB_OUTPUT"
          else
            echo "hazir=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Google Auth
        if: steps.deploy_kontrol.outputs.hazir == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: steps.deploy_kontrol.outputs.hazir == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        if: steps.deploy_kontrol.outputs.hazir == 'true'
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ secrets.GCP_SERVICE_NAME }}
          region: europe-west1
          source: .
          flags: >-
            --allow-unauthenticated
            --port=8080
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=3
          env_vars: |
            NODE_ENV=production
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            EMAIL_FROM=${{ secrets.EMAIL_FROM }}

      - name: Show deployed URL
        if: steps.deploy_kontrol.outputs.hazir == 'true'
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"

      - name: Deploy atlandı
        if: steps.deploy_kontrol.outputs.hazir != 'true'
        run: echo "GCP_SA_KEY veya GCP_SERVICE_NAME tanımlı olmadığı için deploy adımları atlandı."
