steps:
  # 1. Docker image'ı build et
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest'
      - '-f'
      - 'optik360/Dockerfile'
      - 'optik360'

  # 2. Artifact Registry'e push et
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}'

  # 3. Cloud Run'a deploy et
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-secrets=DB_PASSWORD=optik360-db-password:latest,JWT_SECRET=optik360-jwt-secret:latest,ANTHROPIC_API_KEY=optik360-anthropic-key:latest'
      - '--set-env-vars=NODE_ENV=production,DB_HOST=/cloudsql/${_CLOUD_SQL_INSTANCE},DB_PORT=5432,DB_NAME=${_DB_NAME},DB_USER=${_DB_USER}'
      - '--add-cloudsql-instances=${_CLOUD_SQL_INSTANCE}'

substitutions:
  _REGION: europe-west1
  _REPO: optik360
  _SERVICE: optik360-api
  _DB_NAME: optik360_db
  _DB_USER: optik360_user
  _CLOUD_SQL_INSTANCE: YOUR_PROJECT_ID:europe-west1:optik360-pg   # deploy öncesi değiştir

options:
  logging: CLOUD_LOGGING_ONLY
