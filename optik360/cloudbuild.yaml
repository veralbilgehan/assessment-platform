steps:
  # ─── 1. Backend bağımlılıklarını kur ve basit sözdizimi kontrolü ──
  - name: 'node:20-alpine'
    id: 'backend-check'
    entrypoint: sh
    args:
      - '-c'
      - 'cd backend && npm install --prefer-offline && node -e "require(\"./src/app.js\")" || true'
    dir: 'optik360'

  # ─── 2. Frontend build ────────────────────────────────────────────
  - name: 'node:20-alpine'
    id: 'frontend-build'
    entrypoint: sh
    args:
      - '-c'
      - 'cd frontend && npm install --prefer-offline && npm run build'
    dir: 'optik360'

  # ─── 3. Docker image build ────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'docker-build'
    waitFor: ['backend-check', 'frontend-build']
    args:
      - build
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest'
      - '-f'
      - 'optik360/Dockerfile'
      - 'optik360'

  # ─── 4. Artifact Registry'e push ─────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'docker-push'
    waitFor: ['docker-build']
    args:
      - push
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}'

  # ─── 5. Cloud Run'a deploy ────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'cloudrun-deploy'
    waitFor: ['docker-push']
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-secrets=DB_PASSWORD=optik360-db-password:latest,JWT_SECRET=optik360-jwt-secret:latest'
      - '--set-env-vars=NODE_ENV=production,DB_HOST=/cloudsql/${_CLOUD_SQL_INSTANCE},DB_PORT=5432,DB_NAME=${_DB_NAME},DB_USER=${_DB_USER}'
      - '--add-cloudsql-instances=${_CLOUD_SQL_INSTANCE}'

substitutions:
  _REGION: europe-west1
  _REPO: optik360
  _SERVICE: optik360-api
  _DB_NAME: optik360_db
  _DB_USER: optik360_user
  _CLOUD_SQL_INSTANCE: gen-lang-client-0693247342:europe-west1:optik360-pg

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'
